[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-agent"
version = "0.1.0"
description = "Portable terminal-first agent that uses AWS Bedrock Claude models with file, shell, and AWS CLI tools"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Scott Watts" }]

dependencies = [
    "boto3>=1.34",
    "botocore>=1.34",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "prompt_toolkit>=3.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
    "moto>=5.0",
]

[project.scripts]
cc-agent = "cc_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cc_agent = ["default_config.yaml", "default_system_prompt.md"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: tests that require live Bedrock access",
    "security: security-focused tests",
]
